exp.estagio.d=Estagiei por 200h em uma fazenda, na qual tem foco em criação mistad de vacas, ou seja, produção de leite e carne. Realizei atividades diversas, des de cuidar da alimentação do gado, limpar ordenhas, ajudar com a colheita de milho, etc. Este estágio ocorreu na fazenda 3 riachos, situada na MG 409 KM 34.
